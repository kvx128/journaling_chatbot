services:
  orchestrator:
    container_name: journaling-orchestrator
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - journal_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=sqlite:////app/data/journal.db
      - API_KEY=dev-local-key
      - FINANCE_BOT_URL=http://finance-bot:8001
      - JOURNAL_BOT_URL=http://journal-bot:8002
    command: sh -c "uv run alembic upgrade head && uv run uvicorn services.orchestrator.main:app --host 0.0.0.0 --port 8000"

  finance-bot:
    container_name: journaling-finance-bot
    build:
      context: .
      dockerfile: services/finance_bot/Dockerfile
    expose:
      - "8001"
    volumes:
      - journal_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/journal.db
      - API_KEY=dev-local-key

  journal-bot:
    container_name: journaling-journal-bot
    build:
      context: .
      dockerfile: services/journal_bot/Dockerfile
    expose:
      - "8002"
    volumes:
      - journal_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/journal.db
      - API_KEY=dev-local-key
      - MODEL_SERVER_URL=http://model-server:8003

  model-server:
    container_name: journaling-model-server
    build:
      context: .
      dockerfile: services/model_server/Dockerfile
    expose:
      - "8003"
    volumes:
      # Read-only mount of the host's already-populated HF cache so the 2.4GB
      # gated Llama 3.2 1B base model doesn't need to be re-downloaded (or
      # re-authenticated) inside the container. Matches the default cache
      # path a root-user container resolves to (HF_HOME unset -> ~/.cache/huggingface).
      - C:/Users/kvx12/.cache/huggingface/hub:/root/.cache/huggingface/hub:ro
    environment:
      - HF_HUB_OFFLINE=1
      - BASE_MODEL=meta-llama/Llama-3.2-1B-Instruct
      - ADAPTER_DIR=/app/adapter
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  journal_data:
