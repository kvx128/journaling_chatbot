[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "journaling_chatbot"
version = "0.1.0"
description = "Phase 1 deterministic expense and mood logger CLI & orchestrator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "typer",
    "rich",
    "sqlalchemy>=2.0",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "python-dateutil",
    "dateparser",
    "httpx",
    "docker",
    "pytest",
    "pytest-asyncio",
    "dvc>=3.67.1",
]

[project.optional-dependencies]
# Only needed for training/eval scripts (ml/train/*) and the model-server
# service. Kept out of the base dependency set so orchestrator/finance-bot/
# journal-bot Docker images don't pull in a multi-GB CUDA stack they never use.
ml = [
    "torch>=2.11.0",
    "transformers>=5.15.0",
    "peft>=0.20.0",
    "trl>=1.9.2",
    "bitsandbytes>=0.50.0",
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "numpy>=2.5.2",
    "mlflow>=3.0.0",
]

[project.scripts]
journal = "cli.main:app"
journal-label = "cli.label_commands:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "orchestrator*", "services*", "cli*", "ml*"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
