[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "journaling_chatbot"
version = "0.1.0"
description = "Phase 1 deterministic expense and mood logger CLI & orchestrator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "typer",
    "rich",
    "sqlalchemy>=2.0",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "python-dateutil",
    "dateparser",
    "httpx",
    "docker",
    "pytest",
    "pytest-asyncio",
    "dvc>=3.67.1",
]

[project.scripts]
journal = "cli.main:app"
journal-label = "cli.label_commands:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "orchestrator*", "services*", "cli*"]
